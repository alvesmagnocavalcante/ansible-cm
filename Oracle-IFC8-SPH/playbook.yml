---
- name: Verificar e iniciar Oracle IFC8 SPH
  hosts: windows_hosts
  gather_facts: false

  vars:
    ifc_executable: 'C:\Fidelio\Ifc8.Net\IfcApplication\IfcApplication.exe'
    ifc_config: 'C:\Fidelio\Ifc8.Net\IfcApplication\SPH\Ifc8NetConfigSPH.Xml'
    ifc_task_name: 'Oracle IFC8 SPH'
    ifc_user: 'interfaces'

  tasks:
    - name: Garantir tarefa de inicialização do IFC8
      community.windows.win_scheduled_task:
        name: "{{ ifc_task_name }}"
        description: Inicia a instância SPH do Oracle IFC8 na sessão do usuário interfaces.
        actions:
          - path: "{{ ifc_executable }}"
            arguments: '"{{ ifc_config }}"'
            working_directory: 'C:\Fidelio\Ifc8.Net\IfcApplication'
        triggers:
          - type: logon
            user_id: "{{ ifc_user }}"
        username: "{{ ifc_user }}"
        logon_type: interactive_token
        run_level: highest
        multiple_instances: 2
        execution_time_limit: PT0S
        enabled: true
        state: present

    - name: Verificar processo da instância SPH
      ansible.windows.win_powershell:
        script: |
          $config = '{{ ifc_config | replace("'", "''") }}'
          $running = Get-CimInstance Win32_Process -Filter "Name='IfcApplication.exe'" |
            Where-Object { $_.CommandLine -like "*$config*" } |
            Select-Object -First 1
          $Ansible.Result = [bool]$running
          $Ansible.Changed = $false
      register: ifc_status

    - name: Iniciar IFC8 quando estiver parado
      ansible.windows.win_command:
        cmd: 'schtasks.exe /Run /TN "{{ ifc_task_name }}"'
      when: not ifc_status.result
      register: ifc_start
      changed_when: true

    - name: Aguardar inicialização
      ansible.builtin.pause:
        seconds: 10
      when: ifc_start is changed

    - name: Confirmar que a instância está ativa
      ansible.windows.win_powershell:
        script: |
          $config = '{{ ifc_config | replace("'", "''") }}'
          $running = Get-CimInstance Win32_Process -Filter "Name='IfcApplication.exe'" |
            Where-Object { $_.CommandLine -like "*$config*" } |
            Select-Object -First 1
          if (-not $running) {
            throw 'IfcApplication.exe da instância SPH não iniciou.'
          }
          $Ansible.Result = @{ ProcessId = $running.ProcessId }
          $Ansible.Changed = $false
