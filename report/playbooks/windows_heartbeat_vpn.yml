    - name: Aguardar rota do primeiro host passar pela VPN
      ansible.builtin.command:
        argv:
          - /usr/sbin/ip
          - route
          - get
          - "{{ vpn_probe_host }}"
      vars:
        vpn_probe_host: >-
          {{
            hostvars[groups[heartbeat_target_group][0]].ansible_host
            | default(groups[heartbeat_target_group][0])
          }}
      register: vpn_route
      changed_when: false
      retries: 30
      delay: 2
      until:
        - vpn_route.rc == 0
        - "'dev ppp0' in vpn_route.stdout"

    - name: Aguardar estabilizacao do tunel
      ansible.builtin.pause:
        seconds: 3
