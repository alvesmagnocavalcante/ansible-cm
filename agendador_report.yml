---
- name: Monitorar logs do Agendador de Tarefas
  hosts: windows_hosts
  gather_facts: false

  vars:
    periodo_minutos: 60
    log_agendador: "Microsoft-Windows-TaskScheduler/Operational"

  tasks:
    - name: Consultar erros do Agendador
      ansible.windows.win_powershell:
        script: |
          $inicio = (Get-Date).AddMinutes(-{{ periodo_minutos }})

          $eventos = Get-WinEvent -FilterHashtable @{
              LogName   = "{{ log_agendador }}"
              StartTime = $inicio
              Level     = 1, 2
          } -ErrorAction SilentlyContinue

          $resultado = @(
              $eventos | ForEach-Object {
                  [PSCustomObject]@{
                      Data       = $_.TimeCreated.ToString(
                          "yyyy-MM-dd HH:mm:ss"
                      )
                      EventoID   = $_.Id
                      Nivel      = $_.LevelDisplayName
                      Computador = $_.MachineName
                      Mensagem   = $_.Message
                  }
              }
          )

          $Ansible.Result = $resultado
          $Ansible.Changed = $false
      register: resultado_agendador

    - name: Mostrar erros encontrados
      ansible.builtin.debug:
        var: resultado_agendador.result
      when: resultado_agendador.result | length > 0

    - name: Mostrar resumo quando houver erros
      ansible.builtin.debug:
        msg: >-
          ATENÇÃO: foram encontrados
          {{ resultado_agendador.result | length }}
          erros críticos no Agendador de Tarefas
          nos últimos {{ periodo_minutos }} minutos.
      when: resultado_agendador.result | length > 0

    - name: Informar quando não houver erros
      ansible.builtin.debug:
        msg: >-
          Nenhum erro crítico foi encontrado no Agendador de Tarefas
          nos últimos {{ periodo_minutos }} minutos.
      when: resultado_agendador.result | length == 0
