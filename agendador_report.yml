---
- name: Monitorar tarefa SalesMix
  hosts: windows_hosts
  gather_facts: false

  vars:
    tarefa_monitorada: "SalesMix"
    periodo_minutos: 300
    log_agendador: "Microsoft-Windows-TaskScheduler/Operational"

  tasks:
    - name: Consultar informações atuais da tarefa SalesMix
      ansible.windows.win_powershell:
        parameters:
          NomeTarefa: "{{ tarefa_monitorada }}"
        script: |
          param(
              [string]$NomeTarefa
          )

          $tarefa = Get-ScheduledTask -TaskName $NomeTarefa `
              -ErrorAction SilentlyContinue

          if ($null -eq $tarefa) {
              $Ansible.Result = @{
                  Encontrada = $false
                  Nome       = $NomeTarefa
              }

              $Ansible.Changed = $false
              return
          }

          $informacoes = $tarefa | Get-ScheduledTaskInfo

          $Ansible.Result = @{
              Encontrada     = $true
              Nome           = $tarefa.TaskName
              Caminho        = $tarefa.TaskPath
              Estado         = $tarefa.State.ToString()
              UltimaExecucao = if ($informacoes.LastRunTime) {
                  $informacoes.LastRunTime.ToString(
                      "yyyy-MM-dd HH:mm:ss"
                  )
              } else {
                  "Nunca executada"
              }
              ProximaExecucao = if ($informacoes.NextRunTime) {
                  $informacoes.NextRunTime.ToString(
                      "yyyy-MM-dd HH:mm:ss"
                  )
              } else {
                  "Não definida"
              }
              CodigoResultado = $informacoes.LastTaskResult
              ResultadoHex    = "0x{0:X8}" -f $informacoes.LastTaskResult
          }

          $Ansible.Changed = $false
      register: status_salesmix

    - name: Exibir situação atual da tarefa
      ansible.builtin.debug:
        var: status_salesmix.result

    - name: Avisar quando a tarefa não for encontrada
      ansible.builtin.debug:
        msg: >-
          ATENÇÃO: a tarefa {{ tarefa_monitorada }}
          não foi encontrada no servidor.
      when: not (status_salesmix.result.Encontrada | bool)

    - name: Consultar erros específicos da SalesMix
      ansible.windows.win_powershell:
        parameters:
          NomeTarefa: "{{ tarefa_monitorada }}"
          PeriodoMinutos: "{{ periodo_minutos }}"
          NomeLog: "{{ log_agendador }}"
        script: |
          param(
              [string]$NomeTarefa,
              [int]$PeriodoMinutos,
              [string]$NomeLog
          )

          $inicio = (Get-Date).AddMinutes(-$PeriodoMinutos)

          $eventos = Get-WinEvent -FilterHashtable @{
              LogName   = $NomeLog
              StartTime = $inicio
              Level     = 1, 2
          } -ErrorAction SilentlyContinue

          $resultado = @(
              foreach ($evento in $eventos) {
                  $xml = [xml]$evento.ToXml()

                  $nomeEvento = $xml.Event.EventData.Data |
                      Where-Object {
                          $_.Name -eq "TaskName"
                      } |
                      Select-Object -First 1

                  $nomeEncontrado = $nomeEvento.'#text'

                  $pertenceSalesMix =
                      $nomeEncontrado -like "*$NomeTarefa*" -or
                      $evento.Message -like "*$NomeTarefa*"

                  if ($pertenceSalesMix) {
                      [PSCustomObject]@{
                          Data       = $evento.TimeCreated.ToString(
                              "yyyy-MM-dd HH:mm:ss"
                          )
                          EventoID   = $evento.Id
                          Nivel      = $evento.LevelDisplayName
                          Tarefa     = $nomeEncontrado
                          Computador = $evento.MachineName
                          Mensagem   = $evento.Message
                      }
                  }
              }
          )

          $Ansible.Result = $resultado
          $Ansible.Changed = $false
      register: erros_salesmix
      when: status_salesmix.result.Encontrada | bool

    - name: Exibir erros da SalesMix
      ansible.builtin.debug:
        var: erros_salesmix.result
      when:
        - status_salesmix.result.Encontrada | bool
        - erros_salesmix.result | length > 0

    - name: Exibir resumo quando houver erros
      ansible.builtin.debug:
        msg: >-
          ATENÇÃO: foram encontrados
          {{ erros_salesmix.result | length }}
          erros relacionados à tarefa {{ tarefa_monitorada }}
          nos últimos {{ periodo_minutos }} minutos.
      when:
        - status_salesmix.result.Encontrada | bool
        - erros_salesmix.result | length > 0

    - name: Informar que a SalesMix não apresentou erros
      ansible.builtin.debug:
        msg: >-
          A tarefa {{ tarefa_monitorada }} não apresentou erros
          nos últimos {{ periodo_minutos }} minutos.
      when:
        - status_salesmix.result.Encontrada | bool
        - erros_salesmix.result | length == 0
